name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (protocol + brain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (workspace, excluding agent)
        run: cargo test --workspace --exclude agent

  agent-windows:
    name: agent (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build agent
        run: cargo build --release -p agent
      - name: rename artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/agent.exe dist/rust-outpost-agent-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rust-outpost-agent-windows-x64
          path: dist/rust-outpost-agent-windows-x64.exe
          if-no-files-found: error

  brain-macos-arm64:
    name: brain (macos-arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build brain
        run: cargo build --release -p brain
      - name: rename artifact
        run: |
          mkdir -p dist
          cp target/release/brain dist/rust-outpost-brain-macos-arm64
          chmod +x dist/rust-outpost-brain-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: rust-outpost-brain-macos-arm64
          path: dist/rust-outpost-brain-macos-arm64
          if-no-files-found: error

  brain-macos-x86_64:
    name: brain (macos-x86_64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build brain
        run: cargo build --release -p brain
      - name: rename artifact
        run: |
          mkdir -p dist
          cp target/release/brain dist/rust-outpost-brain-macos-x86_64
          chmod +x dist/rust-outpost-brain-macos-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: rust-outpost-brain-macos-x86_64
          path: dist/rust-outpost-brain-macos-x86_64
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, agent-windows, brain-macos-arm64, brain-macos-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: stage release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
